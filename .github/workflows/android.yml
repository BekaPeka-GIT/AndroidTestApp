name: Android build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        # Na main: wydanie v<versionName> z app/build.gradle.kts (tworzone, gdy go jeszcze nie ma,
        # APK nadpisywany przy kolejnych pushach). Na tagu v*: wydanie o nazwie tagu.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(sed -n 's/.*versionName *= *"\(.*\)".*/\1/p' app/build.gradle.kts)"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk MultiKamera.apk
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "MultiKamera $TAG" \
              --notes "Debug APK zbudowany automatycznie przez GitHub Actions."
          gh release upload "$TAG" MultiKamera.apk --clobber
